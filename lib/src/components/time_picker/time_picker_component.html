<div class="time-picker-wrapper" [attr.data-label]="'li_time_picker'" [attr.data-value]="displayValue">
    <div *ngIf="usesMobilePresentation" class="time-picker-mobile-backdrop" (click)="close()"></div>
    <div *ngIf="usesOverlayTriggerIcon" #triggerElement class="time-picker-trigger-shell" [class.disabled]="isDisabled" (click)="toggleOpen()"
        [attr.data-label]="'li_time_picker_trigger'"
        [attr.data-value]="displayValue">
        <input type="text" [attr.data-li-form-focus-target]="'true'" [class]="resolvedOverlayInputClass" [value]="displayValue" [placeholder]="effectivePlaceholder"
            readonly [disabled]="isDisabled" [required]="required"
            [attr.data-label]="'li_time_picker_input'"
            [attr.aria-describedby]="resolvedDescribedBy"
            [attr.aria-invalid]="effectiveInvalid ? 'true' : null"
            [attr.data-invalid]="effectiveInvalid ? 'true' : null">
        <div *ngIf="showsClearButton || showsTriggerIcon" class="time-picker-overlay-actions">
            <button *ngIf="showsClearButton" type="button" class="btn time-picker-overlay-button" [disabled]="isDisabled"
                [attr.aria-label]="clearAriaLabel" [attr.data-label]="'li_time_picker_clear_trigger'" (click)="clearFromTrigger($event)">
                <i class="ph ph-x"></i>
            </button>
            <button *ngIf="showsTriggerIcon" type="button" class="btn time-picker-overlay-button" tabindex="-1" [disabled]="isDisabled">
                <i [class]="resolvedTriggerIconClass"></i>
            </button>
        </div>
    </div>
    <div *ngIf="!usesOverlayTriggerIcon" #triggerElement [class]="resolvedInputGroupClass" (click)="toggleOpen()"
        [attr.data-label]="'li_time_picker_trigger'"
        [attr.data-value]="displayValue">
        <input type="text" [attr.data-li-form-focus-target]="'true'" [class]="resolvedInputClass" [value]="displayValue" [placeholder]="effectivePlaceholder"
            readonly [disabled]="isDisabled" [required]="required"
            [attr.data-label]="'li_time_picker_input'"
            [attr.aria-describedby]="resolvedDescribedBy"
            [attr.aria-invalid]="effectiveInvalid ? 'true' : null"
            [attr.data-invalid]="effectiveInvalid ? 'true' : null">
        <button *ngIf="showsClearButton" type="button" class="btn time-picker-trigger-button" [disabled]="isDisabled"
            [attr.aria-label]="clearAriaLabel" [attr.data-label]="'li_time_picker_clear_trigger'" (click)="clearFromTrigger($event)">
            <i class="ph ph-x"></i>
        </button>
        <button *ngIf="showsTriggerIcon" type="button" class="btn time-picker-trigger-button" tabindex="-1" [disabled]="isDisabled">
            <i [class]="resolvedTriggerIconClass"></i>
        </button>
    </div>
    <div *ngIf="showErrorFeedback" [class]="resolvedFeedbackClass">{{ effectiveErrorText }}</div>
    <div *ngIf="hasHelperText" class="form-text mt-1">{{ helperText }}</div>

    <div #panelElement class="time-picker-panel daterangepicker single ltr show-calendar opensright"
        [attr.data-label]="'li_time_picker_panel'"
        [class.time-picker-panel--mobile-modal]="usesMobileModal"
        [class.time-picker-panel--mobile-sheet]="usesMobileSheet"
        [class.is-open]="isOpen"
        [attr.role]="usesMobilePresentation ? 'dialog' : null"
        [attr.aria-modal]="usesMobilePresentation ? 'true' : null">
        <div class="time-picker-panel-shell">
            <div class="time-picker-title">{{ titleLabel }}</div>

            <div class="time-picker-display-row">
                <input #hourInput type="text"
                    inputmode="numeric"
                    maxlength="2"
                    class="time-picker-display-chip"
                    [attr.data-label]="'li_time_picker_hour_input'"
                    [class.active]="isHourMode"
                    [value]="editableHourText"
                    (focus)="onHourFocus()"
                    (click)="setHourMode()"
                    (input)="onHourInput(hourInput.value)"
                    (blur)="onHourBlur()"
                    (keydown)="onChipKeyDown($event, true)">
                <div class="time-picker-colon">:</div>
                <input #minuteInput type="text"
                    inputmode="numeric"
                    maxlength="2"
                    class="time-picker-display-chip"
                    [attr.data-label]="'li_time_picker_minute_input'"
                    [class.active]="isMinuteMode"
                    [value]="editableMinuteText"
                    (focus)="onMinuteFocus()"
                    (click)="setMinuteMode()"
                    (input)="onMinuteInput(minuteInput.value)"
                    (blur)="onMinuteBlur()"
                    (keydown)="onChipKeyDown($event, false)">
                <div *ngIf="showMeridiem" class="time-picker-meridiem">
                    <button type="button" class="time-picker-meridiem-button" [class.active]="!isPm" [attr.data-label]="'li_time_picker_am'" (click)="setMeridiem(false)">
                        {{ amLabel }}
                    </button>
                    <button type="button" class="time-picker-meridiem-button" [class.active]="isPm" [attr.data-label]="'li_time_picker_pm'" (click)="setMeridiem(true)">
                        {{ pmLabel }}
                    </button>
                </div>
            </div>

            <div #clockFaceElement class="time-picker-clock" (mousedown)="onClockMouseDown($event)" (touchstart)="onClockTouchStart($event)">
                <div class="time-picker-hand"
                    [style.height.%]="handLengthPercent"
                    [style.transform]="'rotate(' + handTransformDegrees.toString() + 'deg)'">
                    <div *ngIf="showFloatingSelector" class="time-picker-selector">
                        <div class="time-picker-selector-label" [class.small-selector]="useCompactSelector">
                            <span *ngIf="selectorHasText" [style.transform]="floatingSelectorLabelTransform">
                                {{ floatingSelectorText }}
                            </span>
                        </div>
                    </div>
                </div>
                <div class="time-picker-center-dot"></div>
                <button type="button" *ngFor="let label of visibleDialLabels; trackBy: trackByDialLabel"
                    [class]="dialLabelClass(label)"
                    [attr.data-label]="'li_time_picker_dial_label'"
                    [attr.data-value]="label.value.toString()"
                    [style.left.%]="label.leftPercent" [style.top.%]="label.topPercent" (click)="onDialLabelClick(label, $event)">
                    {{ label.label }}
                </button>
            </div>

            <div class="time-picker-footer">
                <button *ngIf="showClearButton" type="button" class="btn btn-light btn-sm" [attr.data-label]="'li_time_picker_clear'" (click)="clear()">{{ clearLabel }}</button>
                <button type="button" class="btn btn-light btn-sm" [attr.data-label]="'li_time_picker_cancel'" (click)="close()">{{ cancelLabel }}</button>
                <button type="button" class="btn btn-primary btn-sm" [attr.data-label]="'li_time_picker_apply'" (click)="apply()">{{ okLabel }}</button>
            </div>
        </div>
    </div>
</div>
