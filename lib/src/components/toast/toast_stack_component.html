<div [class]="resolvedContainerClasses"
    aria-live="polite"
    aria-atomic="true"
    [attr.data-label]="'li_toast_stack'"
    [attr.data-value]="placement">
  <div *ngFor="let toast of service?.toasts"
      class="li-toast-stack__item"
      [attr.data-label]="'li_toast_stack_item'"
      [attr.data-value]="toast.automationValue">
    <li-toast
        [header]="toast.header"
        [body]="toast.body"
        [helperText]="toast.helperText"
        [badgeText]="toast.badgeText"
        [iconClass]="toast.iconClass"
        [toastClass]="toast.toastClass"
        [headerClass]="toast.headerClass"
        [bodyClass]="toast.bodyClass"
        [automationValue]="toast.automationValue"
        [ariaLive]="toast.ariaLive"
        [delay]="toast.delay"
        [animation]="toast.animation"
        [autohide]="toast.autohide"
        [dismissible]="toast.dismissible"
        [pauseOnHover]="toast.pauseOnHover"
        [rounded]="toast.rounded"
        (hidden)="removeToast(toast)">
    </li-toast>
  </div>
</div>
