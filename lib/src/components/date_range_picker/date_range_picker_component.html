<div class="date-range-wrapper" [attr.data-label]="'li_date_range_picker'" [attr.data-value]="displayValue">
    <div *ngIf="usesMobilePresentation" class="date-range-mobile-backdrop" (click)="close()"></div>
    <div *ngIf="triggerTemplate != null" #triggerElement
        class="date-range-custom-trigger"
        [class.disabled]="isDisabled"
        [attr.name]="resolvedName"
        [attr.data-li-form-focus-target]="'true'"
        [attr.data-label]="'li_date_range_picker_trigger'"
        [attr.data-value]="displayValue"
        role="button"
        [attr.aria-expanded]="isOpen.toString()"
        [attr.aria-describedby]="resolvedDescribedBy"
        [attr.aria-invalid]="effectiveInvalid ? 'true' : null"
        [attr.data-invalid]="effectiveInvalid ? 'true' : null"
        [attr.tabindex]="isDisabled ? null : '0'"
        (click)="toggleOpen()"
        (keydown)="handleTriggerKeydown($event)">
        <template [ngTemplateOutlet]="triggerTemplate?.templateRef"
            [ngTemplateOutletValue]="triggerContext">
        </template>
    </div>

    <div *ngIf="triggerTemplate == null && usesOverlayTriggerIcon" #triggerElement class="date-range-trigger-shell" [class.disabled]="isDisabled" (click)="toggleOpen()"
        [attr.data-label]="'li_date_range_picker_trigger'"
        [attr.data-value]="displayValue">
        <input type="text" [attr.data-li-form-focus-target]="'true'" [class]="resolvedOverlayInputClass" [value]="displayValue" [placeholder]="effectivePlaceholder"
            readonly [disabled]="isDisabled" [required]="required"
            [attr.name]="resolvedName"
            [attr.data-label]="'li_date_range_picker_input'"
            [attr.aria-describedby]="resolvedDescribedBy"
            [attr.aria-invalid]="effectiveInvalid ? 'true' : null"
            [attr.data-invalid]="effectiveInvalid ? 'true' : null">
        <div *ngIf="showsClearButton || showsTriggerIcon" class="date-range-overlay-actions">
            <button *ngIf="showsClearButton" type="button" class="btn date-range-overlay-button" [disabled]="isDisabled"
                [attr.aria-label]="clearAriaLabel" [attr.data-label]="'li_date_range_picker_clear_trigger'" (click)="clearFromTrigger($event)">
                <i class="ph ph-x"></i>
            </button>
            <button *ngIf="showsTriggerIcon" type="button" class="btn date-range-overlay-button" tabindex="-1" [disabled]="isDisabled">
                <i [class]="resolvedTriggerIconClass"></i>
            </button>
        </div>
    </div>
    <div *ngIf="triggerTemplate == null && !usesOverlayTriggerIcon" #triggerElement [class]="resolvedInputGroupClass" (click)="toggleOpen()"
        [attr.data-label]="'li_date_range_picker_trigger'"
        [attr.data-value]="displayValue">
        <input type="text" [attr.data-li-form-focus-target]="'true'" [class]="resolvedInputClass" [value]="displayValue" [placeholder]="effectivePlaceholder"
            readonly [disabled]="isDisabled" [required]="required"
            [attr.name]="resolvedName"
            [attr.data-label]="'li_date_range_picker_input'"
            [attr.aria-describedby]="resolvedDescribedBy"
            [attr.aria-invalid]="effectiveInvalid ? 'true' : null"
            [attr.data-invalid]="effectiveInvalid ? 'true' : null">
        <button *ngIf="showsClearButton" type="button" class="btn date-range-trigger-button" [disabled]="isDisabled"
            [attr.aria-label]="clearAriaLabel" [attr.data-label]="'li_date_range_picker_clear_trigger'" (click)="clearFromTrigger($event)">
            <i class="ph ph-x"></i>
        </button>
        <button *ngIf="showsTriggerIcon" type="button" class="btn date-range-trigger-button" tabindex="-1" [disabled]="isDisabled">
            <i [class]="resolvedTriggerIconClass"></i>
        </button>
    </div>
    <div *ngIf="showErrorFeedback" [class]="resolvedFeedbackClass">{{ errorText }}</div>
    <div *ngIf="hasHelperText" class="form-text mt-1">{{ helperText }}</div>

    <div #panelElement class="daterangepicker date-range-open ltr show-calendar opensright"
        (click)="onPanelClick($event)"
        [attr.data-label]="'li_date_range_picker_panel'"
        [class.date-range-open--mobile-modal]="usesMobileModal"
        [class.date-range-open--mobile-sheet]="usesMobileSheet"
        [class.date-range-open--with-presets]="showPresetList"
        [class.date-range-open--with-preset-calendars]="showPresetList && showCalendars"
        [class.is-open]="isOpen"
        [attr.role]="usesMobilePresentation ? 'dialog' : null"
        [attr.aria-modal]="usesMobilePresentation ? 'true' : null">
        <div class="date-range-panel-content" [class.date-range-panel-content--presets-only]="showPresetList && !showCalendars">
            <div *ngIf="showPresetList" class="date-range-presets">
                <button type="button" *ngFor="let preset of presets; let idx = index; trackBy: trackByPreset"
                    class="date-range-preset"
                    [class.active]="isPresetActive(preset)"
                    [class.disabled]="isPresetDisabled(preset)"
                    [disabled]="isPresetDisabled(preset)"
                    [attr.data-label]="'li_date_range_picker_preset'"
                    [attr.data-value]="presetDataValue(preset, idx)"
                    (click)="selectPreset(preset)">
                    {{ preset.label }}
                </button>
                <button *ngIf="showCustomRangePreset" type="button"
                    class="date-range-preset"
                    [class.active]="isCustomRangePresetActive()"
                    [attr.data-label]="'li_date_range_picker_custom_range'"
                    [attr.data-value]="'custom'"
                    (click)="showCustomRange()">
                    {{ resolvedCustomRangePresetLabel }}
                </button>
            </div>

            <div *ngIf="showCalendars" class="drp-calendars">
                <div class="drp-calendar left">
                    <div class="date-range-panel-header">
                        <button type="button" class="calendar-nav prev available" [attr.data-label]="'li_date_range_picker_left_prev'" (click)="prevMonth()">
                            <span></span>
                        </button>
                        <button type="button" class="date-range-view-switch" [attr.data-label]="'li_date_range_picker_left_view_switch'" (click)="toggleLeftViewMode()">
                            {{ leftHeaderLabel }}
                        </button>
                        <button type="button" class="calendar-nav next available" [attr.data-label]="'li_date_range_picker_left_next'" (click)="nextMonth()">
                            <span></span>
                        </button>
                    </div>

                    <div class="calendar-table" *ngIf="isLeftDayView">
                        <table class="table-condensed date-range-calendar-table">
                            <thead>
                                <tr>
                                    <th *ngFor="let weekday of weekdayLabels; trackBy: trackByYear">{{ weekday }}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let week of leftCalendar; trackBy: trackByWeek">
                                    <td *ngFor="let cell of week; trackBy: trackByCell" [class.off]="!cell.isCurrentMonth"
                                        [class.disabled]="isDisabledDate(cell.date)" [class.available]="!isDisabledDate(cell.date)"
                                        [class.today]="isToday(cell.date)"
                                        [class.active]="isStartDate(cell.date) || isEndDate(cell.date)"
                                        [class.start-date]="isStartDate(cell.date)" [class.end-date]="isEndDate(cell.date)"
                                        [class.in-range]="isInRange(cell.date)" (mouseenter)="hoverDay(cell.date)"
                                        [attr.data-label]="'li_date_range_picker_day'"
                                        [attr.data-calendar]="'left'"
                                        [attr.data-value]="dateDataValue(cell.date)"
                                        (click)="selectDay(cell.date)">
                                        {{ cell.date.day }}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div *ngIf="isLeftMonthView" class="date-range-selection-grid">
                        <button type="button" *ngFor="let option of monthOptions; trackBy: trackByMonthOption"
                            class="date-range-selection-item" [class.active]="option.month == leftMonth.month"
                            [class.disabled]="isMonthDisabled(leftMonth.year, option.month)"
                            [attr.data-label]="'li_date_range_picker_month'"
                            [attr.data-calendar]="'left'"
                            [attr.data-value]="option.month.toString()"
                            (click)="selectLeftMonth(option.month)">
                            {{ option.label }}
                        </button>
                    </div>

                    <div *ngIf="isLeftYearView" class="date-range-selection-grid date-range-selection-grid-years">
                        <button type="button" *ngFor="let year of leftVisibleYears; trackBy: trackByYear"
                            class="date-range-selection-item" [class.active]="year == leftMonth.year"
                            [class.disabled]="isYearDisabled(year)" [attr.data-label]="'li_date_range_picker_year'"
                            [attr.data-calendar]="'left'" [attr.data-value]="year.toString()" (click)="selectLeftYear(year)">
                            {{ year }}
                        </button>
                    </div>
                </div>

                <div class="drp-calendar right">
                    <div class="date-range-panel-header">
                        <button type="button" class="calendar-nav prev available" [attr.data-label]="'li_date_range_picker_right_prev'" (click)="prevMonth()">
                            <span></span>
                        </button>
                        <button type="button" class="date-range-view-switch" [attr.data-label]="'li_date_range_picker_right_view_switch'" (click)="toggleRightViewMode()">
                            {{ rightHeaderLabel }}
                        </button>
                        <button type="button" class="calendar-nav next available" [attr.data-label]="'li_date_range_picker_right_next'" (click)="nextMonth()">
                            <span></span>
                        </button>
                    </div>

                    <div class="calendar-table" *ngIf="isRightDayView">
                        <table class="table-condensed date-range-calendar-table">
                            <thead>
                                <tr>
                                    <th *ngFor="let weekday of weekdayLabels; trackBy: trackByYear">{{ weekday }}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let week of rightCalendar; trackBy: trackByWeek">
                                    <td *ngFor="let cell of week; trackBy: trackByCell" [class.off]="!cell.isCurrentMonth"
                                        [class.disabled]="isDisabledDate(cell.date)" [class.available]="!isDisabledDate(cell.date)"
                                        [class.today]="isToday(cell.date)"
                                        [class.active]="isStartDate(cell.date) || isEndDate(cell.date)"
                                        [class.start-date]="isStartDate(cell.date)" [class.end-date]="isEndDate(cell.date)"
                                        [class.in-range]="isInRange(cell.date)" (mouseenter)="hoverDay(cell.date)"
                                        [attr.data-label]="'li_date_range_picker_day'"
                                        [attr.data-calendar]="'right'"
                                        [attr.data-value]="dateDataValue(cell.date)"
                                        (click)="selectDay(cell.date)">
                                        {{ cell.date.day }}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div *ngIf="isRightMonthView" class="date-range-selection-grid">
                        <button type="button" *ngFor="let option of monthOptions; trackBy: trackByMonthOption"
                            class="date-range-selection-item" [class.active]="option.month == rightMonth.month"
                            [class.disabled]="isMonthDisabled(rightMonth.year, option.month)"
                            [attr.data-label]="'li_date_range_picker_month'"
                            [attr.data-calendar]="'right'"
                            [attr.data-value]="option.month.toString()"
                            (click)="selectRightMonth(option.month)">
                            {{ option.label }}
                        </button>
                    </div>

                    <div *ngIf="isRightYearView" class="date-range-selection-grid date-range-selection-grid-years">
                        <button type="button" *ngFor="let year of rightVisibleYears; trackBy: trackByYear"
                            class="date-range-selection-item" [class.active]="year == rightMonth.year"
                            [class.disabled]="isYearDisabled(year)" [attr.data-label]="'li_date_range_picker_year'"
                            [attr.data-calendar]="'right'" [attr.data-value]="year.toString()" (click)="selectRightYear(year)">
                            {{ year }}
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div *ngIf="showCalendars" class="drp-buttons">
            <span class="drp-selected">
                {{ draftDisplayValue.isEmpty ? emptySelectionLabel : draftDisplayValue }}
            </span>
            <button *ngIf="showClearButton" type="button" class="btn btn-light btn-sm" [attr.data-label]="'li_date_range_picker_clear'" (click)="clear()">
                {{ clearLabel }}
            </button>
            <button type="button" class="btn btn-light btn-sm" [attr.data-label]="'li_date_range_picker_cancel'" (click)="close()">
                {{ cancelLabel }}
            </button>
            <button type="button" class="btn btn-primary btn-sm" [disabled]="!canApply" [attr.data-label]="'li_date_range_picker_apply'" (click)="apply()">
                {{ applyLabel }}
            </button>
        </div>
    </div>
</div>
