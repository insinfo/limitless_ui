<!--datatable_component.html-->
<div [attr.data-label]="'li_dt'"
    [attr.data-value]="getCurrentPage.toString()"
    [attr.data-view]="gridMode ? 'grid' : 'table'"
    #card class="dataTables_wrapper dt-bootstrap5 no-footer">
    <div class="datatable-header" [class.p-0]="disableHeaderPadding == true"
        [class.datatable-header--custom]="hasCustomHeader"
        [attr.data-label]="'li_dt_head'">
        <template [ngIf]="hasCustomHeader">
            <template [ngTemplateOutlet]="resolvedHeaderTemplate" [ngTemplateOutletValue]="headerTemplateContext">
            </template>
        </template>

        <template [ngIf]="!hasCustomHeader">
            <div class="dataTables_filter" *ngIf="searchInFields.isNotEmpty">
                <div class="datatable-search-toolbar">
                    <input [(ngModel)]="dataTableFilter.searchString" #inputSearchElement
                        (keypress)="handleSearchInputKeypress($event)" [attr.data-label]="'li_dt_search'"
                        [attr.data-value]="dataTableFilter.searchString"
                        type="search" class="form-control data-table-search-field datatable-search-input"
                        placeholder="{{searchPlaceholder}}" />
                    <div class="datatable-search-toolbar-secondary">
                        <select #selectSearchField
                            (change)="handleSearchFieldSelectChange($event, selectSearchField.value)"
                            class="form-select datatable-search-field-select"
                            [attr.data-label]="'li_dt_search_field'">
                            <option *ngFor="let field of searchInFields; let i = index" value="{{i}}"
                                [attr.data-label]="'li_dt_search_opt'"
                                [attr.data-value]="i.toString()"
                                [selected]="field.selected">
                                {{field.label}}
                            </option>
                        </select>
                    <button class="btn btn-flat-primary border-transparent btn-icon datatable-search-submit"
                            [attr.title]="searchButtonTitle"
                            [attr.aria-label]="searchButtonTitle"
                            type="button" (click)="onSearch()"
                            [attr.data-label]="'li_dt_search_btn'">
                            <i class="ph-magnifying-glass"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="dataTables_length d-flex align-items-center datatable-header-actions">
                <div *ngIf="showExportMenu"
                    class="dropdown me-2"
                    liDropdownMenuPosition="bottom-end"
                    [attr.data-label]="'li_dt_export'">
                    <button type="button" [attr.title]="exportMenuButtonTitle"
                        [attr.aria-label]="exportMenuButtonTitle"
                        [attr.data-label]="'li_dt_export_btn'"
                        class="btn btn-flat-primary border-transparent btn-icon li-dropdown-trigger"
                        aria-expanded="false">
                        <i class="ph ph-file-arrow-down"></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end"
                        [attr.data-label]="'li_dt_export_panel'">
                        <button type="button" (click)="exportPdf()"
                            [attr.data-label]="'li_dt_export_item'"
                            [attr.data-value]="'pdf'"
                            class="dropdown-item cursor-pointer li-dropdown-close">
                            <i class="ph-file-pdf me-2"></i>
                            {{exportPdfLabel}}
                        </button>
                        <button type="button" (click)="exportXlsx()"
                            [attr.data-label]="'li_dt_export_item'"
                            [attr.data-value]="'xlsx'"
                            class="dropdown-item cursor-pointer li-dropdown-close">
                            <i class="ph-file-xls me-2"></i>
                            {{exportXlsxLabel}}
                        </button>
                        <button *ngFor="let menuAction of exportMenuActions; let actionIndex = index"
                            type="button"
                            (click)="menuAction.action()"
                            [attr.data-label]="'li_dt_export_item'"
                            [attr.data-value]="'custom-' + actionIndex.toString()"
                            class="dropdown-item cursor-pointer li-dropdown-close">
                            <i *ngIf="menuAction.iconClass != null" [class]="menuAction.iconClass ?? ''"
                                class="me-2"></i>
                            {{menuAction.label}}
                        </button>
                    </div>
                </div>

                <button *ngIf="enableGridMode"
                    (click)="changeViewMode()"
                    [attr.title]="toggleViewModeButtonTitle"
                    [attr.aria-label]="toggleViewModeButtonTitle"
                    [attr.data-label]="'li_dt_view_btn'"
                    [attr.data-value]="gridMode ? 'grid' : 'table'"
                    class="btn btn-flat-primary border-transparent btn-icon me-2" type="button">
                    <i [class.ph-squares-four]="!gridMode" [class.ph-list-bullets]="gridMode"></i>
                </button>

                <div class="dropdown me-2"
                    liDropdownMenuPosition="bottom-end"
                    [attr.data-label]="'li_dt_cols'">
                    <button type="button" class="btn btn-flat-primary border-transparent btn-icon li-dropdown-trigger"
                        [attr.title]="toggleColumnsButtonTitle"
                        [attr.aria-label]="toggleColumnsButtonTitle"
                        [attr.data-label]="'li_dt_cols_btn'"
                        aria-expanded="false">
                        <i class="ph-eye"></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end"
                        [attr.data-label]="'li_dt_cols_panel'">
                        <div class="dropdown-item border-bottom mb-1 pb-1">
                            <button type="button" class="btn btn-sm btn-light w-100"
                                [attr.data-label]="'li_dt_cols_all'"
                                [attr.data-value]="allColumnsVisible ? 'visible' : 'hidden'"
                                (click)="toggleAllColumnsVisibility()">
                                {{allColumnsVisible ? hideAllColumnsLabel : showAllColumnsLabel}}
                            </button>
                        </div>
                        <label *ngFor="let col of settings.colsDefinitions"
                            class="dropdown-item"
                            [attr.data-label]="'li_dt_col_vis_item'"
                            [attr.data-value]="col.key">
                            <input (click)="changeVisibilityOfCol(col)" type="checkbox"
                                class="form-check-input cursor-pointer m-0 me-3"
                                [attr.data-label]="'li_dt_col_vis_check'"
                                [attr.data-value]="col.key"
                                [checked]="isColumnEffectivelyVisible(col)" />
                            {{col.title}}
                        </label>
                    </div>
                </div>

                <select #selectItemsPerPage (change)="changeItemsPerPageHandler(selectItemsPerPage)"
                    name="DataTables_length" class="form-select datatable-items-per-page-select"
                    [attr.data-label]="'li_dt_page_size'"
                    [attr.data-value]="(dataTableFilter.limit ?? 0).toString()">
                    <option *ngFor="let ipp of limitPerPageOptions" value="{{ipp}}"
                        [attr.data-label]="'li_dt_page_size_opt'"
                        [attr.data-value]="ipp.toString()"
                        [selected]="ipp == dataTableFilter.limit">
                        {{ipp}}
                    </option>
                </select>
            </div>
        </template>
    </div>

    <div *ngIf="showTableView" #scrollContainer class="datatable-scroll"
        [class.datatable-scroll--virtual]="isTableVirtualScrollActive"
        [class.datatable-scroll--sticky-header]="isStickyTableHeaderOnVirtualScrollActive"
        [attr.data-label]="'li_dt_scroll'"
        [liCssStyle]="resolvedScrollContainerStyleCss" (scroll)="onVirtualViewportScroll()">
        <table #table class="table datatable-basic dataTable no-footer dtr-inline"
            [class.datatable-fast-table]="isSaliPagedPerformanceProfile"
            [class.datatable-table-layout-fixed]="fixedTableLayout"
            [class.table-hover]="disableRowClick == false" [class.collapsed]="hasResponsiveCollapsedColumns"
            [attr.data-label]="'li_dt_table'">
            <thead>
                <tr role="row">
                    <th *ngIf="showCheckboxToSelectRow"
                        class="datatable-first-col"
                        [attr.data-label]="'li_dt_hcheck'">
                        <input *ngIf="!allowSingleSelectionOnly" class="form-check-input m-0 me-3"
                            [checked]="isSelectAll" (click)="onSelectAll($event)" type="checkbox" autocomplete="off"
                            [attr.data-label]="'li_dt_check_all'"
                            [attr.data-value]="isSelectAll ? 'true' : 'false'"
                            tabindex="-1" />
                    </th>
                    <th *ngFor="let colDef of settings.colsDefinitions; let idxCol = index; trackBy: trackByColumnKey"
                        [class]="colDef.headerClass ?? ''" [class.sorting]="colDef.enableSorting"
                        [class.hide]="!colDef.visibility || isRuntimeResponsiveHidden(colDef)"
                        [class.datatable-fixed-col]="isFixedColumn(colDef)"
                        [class.datatable-fixed-col--left]="isLeftFixedColumn(colDef)"
                        [class.datatable-fixed-col--right]="isRightFixedColumn(colDef)"
                        [class.datatable-mobile-hidden]="isRuntimeResponsiveHidden(colDef)"
                        [class.dtr-hidden]="isRuntimeResponsiveHidden(colDef)" [attr.data-key]="colDef.key"
                        [attr.data-label]="'li_dt_hcol_' + idxCol.toString()"
                        [attr.data-value]="colDef.key"
                        [attr.data-sort-key]="colDef.sortingBy ?? ''"
                        [liCssStyle]="resolvedHeaderStyleCss(colDef, idxCol)" (click)="onHeaderCellClick($event, colDef)"
                        tabindex="0">
                        <span class="datatable-header-title-shell">
                            <span *ngIf="useSimpleHeaderTitle(colDef)" class="datatable-header-title-content">
                                {{titleHelp.resolveRenderedTitle(colDef)}}
                            </span>

                            <template [ngIf]="!useSimpleHeaderTitle(colDef)">
                                <span class="datatable-header-title-content"
                                    [class.datatable-header-title-inline-help]="titleHelp.isTitleTooltipInline(colDef)"
                                    [liTooltip]="titleHelp.resolveTitleTooltipText(colDef)"
                                    [disableTooltip]="!titleHelp.isTitleTooltipInline(colDef) || titleHelp.useNativeTitleTooltip(colDef)"
                                    [placement]="titleHelp.resolveTitleTooltipPlacement(colDef)"
                                    [triggers]="titleHelp.resolveTitleTooltipTrigger(colDef)"
                                    [html]="titleHelp.resolveTitleTooltipAllowHtml(colDef)"
                                    [tooltipClass]="titleHelp.resolveTitleTooltipClass(colDef)"
                                    [container]="titleHelp.resolveTitleTooltipContainer(colDef)"
                                    [openDelay]="titleHelp.resolveTitleTooltipOpenDelay(colDef)"
                                    [closeDelay]="titleHelp.resolveTitleTooltipCloseDelay(colDef)"
                                    [attr.title]="titleHelp.isTitleTooltipInline(colDef) ? titleHelp.resolveNativeTitleTooltipText(colDef) : null"
                                    [attr.data-header-help]="titleHelp.isTitleTooltipInline(colDef) ? 'tooltip-inline' : null">
                                    <template [ngIf]="hasHeaderCellTemplateFor(colDef)">
                                        <template [ngTemplateOutlet]="resolveHeaderCellTemplateFor(colDef)"
                                            [ngTemplateOutletValue]="resolveHeaderCellTemplateContext(colDef, idxCol)">
                                        </template>
                                    </template>
                                    <template [ngIf]="!hasHeaderCellTemplateFor(colDef) && titleHelp.hasRenderedTitleHtml(colDef)">
                                        <span [liSafeHtml]="''" [liSafeHtmlNode]="colDef.titleHtmlElement"></span>
                                    </template>
                                    <template [ngIf]="!hasHeaderCellTemplateFor(colDef) && !titleHelp.hasRenderedTitleHtml(colDef)">
                                        {{titleHelp.resolveRenderedTitle(colDef)}}
                                    </template>
                                </span>

                                <button *ngIf="titleHelp.hasTitleTooltip(colDef) && !titleHelp.isTitleTooltipInline(colDef)" type="button"
                                    [class]="titleHelp.resolveTitleTooltipButtonClass(colDef) + ' datatable-header-help-control'"
                                    [liTooltip]="titleHelp.resolveTitleTooltipText(colDef)"
                                    [disableTooltip]="titleHelp.useNativeTitleTooltip(colDef)"
                                    [placement]="titleHelp.resolveTitleTooltipPlacement(colDef)"
                                    [triggers]="titleHelp.resolveTitleTooltipTrigger(colDef)"
                                    [html]="titleHelp.resolveTitleTooltipAllowHtml(colDef)"
                                    [tooltipClass]="titleHelp.resolveTitleTooltipClass(colDef)"
                                    [container]="titleHelp.resolveTitleTooltipContainer(colDef)"
                                    [openDelay]="titleHelp.resolveTitleTooltipOpenDelay(colDef)"
                                    [closeDelay]="titleHelp.resolveTitleTooltipCloseDelay(colDef)"
                                    [attr.title]="titleHelp.resolveNativeTitleTooltipText(colDef)"
                                    [attr.aria-label]="titleHelp.resolveTitleTooltipAriaLabel(colDef)"
                                    [attr.data-label]="'li_dt_htip'"
                                    [attr.data-value]="colDef.key"
                                    [attr.data-header-help]="'tooltip'">
                                    <i [class]="titleHelp.resolveTitleTooltipIconClass(colDef)"></i>
                                </button>

                                <button *ngIf="titleHelp.hasTitlePopover(colDef)" type="button"
                                    [class]="titleHelp.resolveTitlePopoverButtonClass(colDef) + ' datatable-header-help-control'"
                                    [liPopover]="titleHelp.resolveTitlePopoverBody(colDef)"
                                    [popoverTitle]="titleHelp.resolveTitlePopoverTitle(colDef)"
                                    [placement]="titleHelp.resolveTitlePopoverPlacement(colDef)"
                                    [trigger]="titleHelp.resolveTitlePopoverTrigger(colDef)"
                                    [html]="titleHelp.resolveTitlePopoverAllowHtml(colDef)"
                                    [popoverClass]="titleHelp.resolveTitlePopoverClass(colDef)"
                                    [container]="titleHelp.resolveTitlePopoverContainer(colDef)"
                                    [autoClose]="titleHelp.resolveTitlePopoverAutoClose(colDef)"
                                    [openDelay]="titleHelp.resolveTitlePopoverOpenDelay(colDef)"
                                    [closeDelay]="titleHelp.resolveTitlePopoverCloseDelay(colDef)"
                                    [attr.aria-label]="titleHelp.resolveTitlePopoverAriaLabel(colDef)"
                                    [attr.data-label]="'li_dt_hpop'"
                                    [attr.data-value]="colDef.key"
                                    [attr.data-header-help]="'popover'">
                                    <i [class]="titleHelp.resolveTitlePopoverIconClass(colDef)"></i>
                                </button>
                            </template>
                        </span>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr *ngIf="isTableVirtualScrollActive && virtualTopSpacerHeight > 0" class="datatable-virtual-spacer"
                    aria-hidden="true">
                    <td [attr.colspan]="virtualSpacerColspan.toString()" [style.height.px]="virtualTopSpacerHeight"></td>
                </tr>
                <template ngFor let-view [ngForOf]="renderedRows" let-idxR="index" [ngForTrackBy]="trackByRenderedRow">
                    <tr [class.cursor-pointer]="disableRowClick == false && view.row.type != DatatableRowType.groupTitle"
                        [class.dt-hasChild]="view.row.isExpanded && view.hasResponsiveHiddenColumns"
                        [class.dtr-expanded]="view.row.isExpanded && view.hasResponsiveHiddenColumns"
                        [class.datatable-group-title-row]="view.row.type == DatatableRowType.groupTitle"
                        [attr.data-index]="view.row.index.toString()"
                        [attr.data-label]="'li_dt_row_' + idxR.toString()"
                        [attr.data-value]="view.row.index.toString()"
                        [liCssStyle]="view.row.styleCss"
                        (click)="rowClickHandler(view.row)">
                        <td *ngIf="showCheckboxToSelectRow && view.row.type == DatatableRowType.normal"
                            class="datatable-first-col" (click)="stopPropagation($event)">
                            <input class="cursor-pointer form-check-input m-0 me-3" (click)="onSelect($event, view.row)"
                                type="checkbox" [checked]="view.row.selected" autocomplete="off" tabindex="-1"
                                [attr.data-label]="'li_dt_check'"
                                [attr.data-value]="view.row.index.toString()" />
                        </td>

                        <td *ngFor="let column of view.row.columns; let idxC = index; trackBy: trackByColumnKey"
                            [class]="column.cellClass ?? ''"
                            [class.hide]="!column.visibility || isRuntimeResponsiveHidden(column)"
                            [class.datatable-fixed-col]="isFixedColumn(column)"
                            [class.datatable-fixed-col--left]="isLeftFixedColumn(column)"
                            [class.datatable-fixed-col--right]="isRightFixedColumn(column)"
                            [class.datatable-mobile-hidden]="isRuntimeResponsiveHidden(column)"
                            [class.dtr-hidden]="isRuntimeResponsiveHidden(column)"
                            [class.dtr-control]="isResponsiveControlColumn(view, column)"
                            [class.datatable-group-title-cell]="view.row.type == DatatableRowType.groupTitle"
                            [attr.aria-expanded]="isResponsiveControlColumn(view, column) ? view.row.isExpanded.toString() : null"
                            [attr.colspan]="column.colspan.toString()" [liCssStyle]="resolvedCellStyleCss(column, idxC)"
                            [attr.data-label]="'li_dt_col_' + idxC.toString()"
                            [attr.data-value]="column.key"
                            (click)="isResponsiveControlColumn(view, column) ? onResponsiveControlClick($event, view) : null">
                            <template [ngIf]="hasCellTemplateFor(column)">
                                <template [ngTemplateOutlet]="resolveCellTemplateFor(column)"
                                    [ngTemplateOutletValue]="resolveCellTemplateContext(view, column, idxR, idxC)">
                                </template>
                            </template>
                            <template [ngIf]="usePlainTextCell(column)">
                                {{column.value}}
                            </template>
                            <template [ngIf]="!usePlainTextCell(column) && !hasCellTemplateFor(column)">
                                <span [liSafeHtml]="column.value" [liSafeHtmlNode]="column.htmlElement"></span>
                            </template>
                        </td>
                    </tr>
                    <tr *ngIf="view.row.isExpanded && view.hasResponsiveHiddenColumns"
                        class="child"
                        [attr.data-label]="'li_dt_child_row'"
                        [attr.data-value]="view.row.index.toString()">
                        <td class="child"
                            [attr.data-label]="'li_dt_child_cell'"
                            [attr.data-value]="view.row.index.toString()"
                            [attr.colspan]="(view.row.columns.length + (showCheckboxToSelectRow ? 1 : 0)).toString()">
                            <ul class="dtr-details">
                                <li *ngFor="let column of view.responsiveHiddenColumns; let idxHidden = index; trackBy: trackByColumnKey"
                                    [attr.data-dtr-index]="idxHidden.toString()"
                                    [attr.data-label]="'li_dt_child_item'"
                                    [attr.data-value]="column.key">
                                    <span class="dtr-title">{{column.title}}</span>
                                    <span class="dtr-data" [liSafeHtml]="column.value"
                                        [liSafeHtmlNode]="column.htmlElement"></span>
                                </li>
                            </ul>
                        </td>
                    </tr>
                </template>
                <tr *ngIf="isTableVirtualScrollActive && virtualBottomSpacerHeight > 0" class="datatable-virtual-spacer"
                    aria-hidden="true">
                    <td [attr.colspan]="virtualSpacerColspan.toString()" [style.height.px]="virtualBottomSpacerHeight"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div *ngIf="showGridView" #gridScrollContainer class="datatable-grid-scroll"
        [class.datatable-scroll--virtual]="isGridVirtualScrollActive"
        [attr.data-label]="'li_dt_grid_scroll'"
        [liCssStyle]="resolvedGridScrollContainerStyleCss" (scroll)="onVirtualViewportScroll()">
        <div [class]="resolvedGridContainerClass"
            [attr.data-label]="'li_dt_grid'"
            [liCssStyle]="resolvedGridContainerStyleCss">
        <div class="grid-layout" [class.grid-layout--virtual]="isGridVirtualScrollActive"
            [attr.data-label]="'li_dt_grid_layout'"
            [liCssStyle]="resolvedGridLayoutStyleCss">
            <div *ngIf="rows.isEmpty"
                class="datatable-empty-state"
                [attr.data-label]="'li_dt_empty'">
                <div class="datatable-empty-state__illustration" aria-hidden="true">
                    <span class="datatable-empty-state__circle"></span>
                    <span class="datatable-empty-state__handle"></span>
                    <span class="datatable-empty-state__line datatable-empty-state__line--top"></span>
                    <span class="datatable-empty-state__line datatable-empty-state__line--bottom"></span>
                </div>
                <div class="datatable-empty-state__label">{{ resolvedEmptyStateLabel }}</div>
            </div>

            <div *ngIf="isGridVirtualScrollActive && virtualTopSpacerHeight > 0" class="grid-virtual-spacer"
                [style.height.px]="virtualTopSpacerHeight" aria-hidden="true"></div>

            <div *ngFor="let row of rows; let i = index; trackBy: trackByRow" class="grid-item"
                [class.content-divider]="row.type == DatatableRowType.groupTitle"
                [class.datatable-grid-item-custom]="row.customCardElement != null"
                [class.datatable-grid-item-default]="row.type == DatatableRowType.normal && row.customCardElement == null && !hasCustomCardTemplate"
                [class.datatable-grid-item-template]="row.type == DatatableRowType.normal && row.customCardElement == null && hasCustomCardTemplate"
                [attr.data-label]="'li_dt_grid_item'"
                [attr.data-value]="row.index.toString()"
                [liCssStyle]="row.styleCss">

                <span *ngIf="row.type == DatatableRowType.groupTitle" class="text-center text-muted p-2">
                    <span *ngFor="let column of row.columns; trackBy: trackByColumnKey" [liSafeHtml]="column.value"
                        [liSafeHtmlNode]="column.htmlElement"></span>
                </span>

                <div class="datatable-custom-card" *ngIf="row.customCardElement != null"
                    [class.cursor-pointer]="disableRowClick == false" [liSafeHtmlNode]="row.customCardElement"
                    [attr.data-label]="'li_dt_card_custom'"
                    [attr.data-value]="row.index.toString()"
                    (click)="rowClickHandler(row)">
                </div>

                <div class="datatable-template-card"
                    *ngIf="row.type == DatatableRowType.normal && row.customCardElement == null && hasCustomCardTemplate"
                    [class.cursor-pointer]="disableRowClick == false"
                    [attr.data-label]="'li_dt_card_tpl'"
                    [attr.data-value]="row.index.toString()"
                    (click)="rowClickHandler(row)">
                    <template [ngTemplateOutlet]="resolvedCardTemplate"
                        [ngTemplateOutletValue]="resolveCardTemplateContext(row, i)">
                    </template>
                </div>

                <div class="datatable-grid-default-card"
                    *ngIf="row.customCardElement == null && !hasCustomCardTemplate && row.columnsCardBody.isNotEmpty"
                    [class.cursor-pointer]="disableRowClick == false"
                    [attr.data-label]="'li_dt_card_default'"
                    [attr.data-value]="row.index.toString()"
                    (click)="rowClickHandler(row)">
                    <div *ngFor="let column of row.columnsCardBody; trackBy: trackByColumnKey"
                        class="datatable-grid-default-card__field"
                        [class.hide]="column.visibility == false && column.visibilityOnCard == false"
                        [liCssStyle]="column.styleCss">
                        <span class="datatable-grid-default-card__label" *ngIf="column.showTitleOnCard">
                            {{column.title}}<span *ngIf="column.title.isNotEmpty">:</span>
                        </span>
                        <div class="datatable-grid-default-card__value" *ngIf="column.htmlElement != null"
                            [liSafeHtmlNode]="column.htmlElement"></div>
                        <div class="datatable-grid-default-card__value" *ngIf="column.htmlElement == null"
                            [liSafeHtml]="column.value"></div>
                    </div>

                    <div *ngIf="row.columnsCardFooter.isNotEmpty" class="datatable-grid-default-card__footer">
                        <div *ngFor="let column of row.columnsCardFooter; trackBy: trackByColumnKey"
                            class="datatable-grid-default-card__field"
                            [class.hide]="column.visibility == false && column.visibilityOnCard == false"
                            [liCssStyle]="column.styleCss">
                            <span class="datatable-grid-default-card__label" *ngIf="column.showTitleOnCard">
                                {{column.title}}<span *ngIf="column.title.isNotEmpty">:</span>
                            </span>
                            <div class="datatable-grid-default-card__value" *ngIf="column.htmlElement != null"
                                [liSafeHtmlNode]="column.htmlElement"></div>
                            <div class="datatable-grid-default-card__value" *ngIf="column.htmlElement == null"
                                [liSafeHtml]="column.value"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div *ngIf="isGridVirtualScrollActive && virtualBottomSpacerHeight > 0" class="grid-virtual-spacer"
                [style.height.px]="virtualBottomSpacerHeight" aria-hidden="true"></div>
        </div>
        </div>
    </div>

    <div class="datatable-footer"
        [class.datatable-footer--custom]="hasCustomFooter"
        [attr.data-label]="'li_dt_foot'">
        <template [ngIf]="hasCustomFooter">
            <template [ngTemplateOutlet]="resolvedFooterTemplate" [ngTemplateOutletValue]="footerTemplateContext">
            </template>
        </template>

        <template [ngIf]="!hasCustomFooter">
            <div class="dataTables_info"
                role="status"
                aria-live="polite"
                [attr.data-label]="'li_dt_page_summary'">
                {{ paginationSummaryText }}
            </div>
            <div class="dataTables_paginate paging_simple_numbers datatable-pagination-scroll"
                [attr.data-label]="'li_dt_page'">
                <li-pagination appearance="datatable" variant="flat" linkClass="rounded" [collectionSize]="totalRecords"
                    [pageSize]="dataTableFilter.limit ?? 0" [page]="getCurrentPage"
                    [maxSize]="resolvedPaginationButtonQuantity" [rotate]="true" [ellipses]="false"
                    [boundaryLinks]="numPages > 1" (pageChange)="changePage($event)">
                    <template liPaginationFirst>
                        <i class="ph ph-arrow-line-left"></i>
                    </template>

                    <template liPaginationPrevious>
                        <i class="ph ph-caret-left"></i>
                    </template>

                    <template liPaginationNext>
                        <i class="ph ph-caret-right"></i>
                    </template>

                    <template liPaginationLast>
                        <i class="ph ph-arrow-line-right"></i>
                    </template>
                </li-pagination>
            </div>
        </template>
    </div>
</div>
