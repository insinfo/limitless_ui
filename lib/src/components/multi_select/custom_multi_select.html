<div [attr.data-label]="'li_multi_select'" [attr.data-value]="selectedDataValue" class="dropdown-collection">
    <div *ngIf="triggerTemplate != null" #dropdownButton
        class="li-multi-select-custom-trigger"
        [class.disabled]="isDisabled"
        [attr.data-label]="'li_multi_select_btn_toggle'"
        [attr.data-value]="selectedDataValue"
        [attr.data-li-form-focus-target]="'true'"
        role="combobox"
        aria-haspopup="listbox"
        [attr.aria-expanded]="dropdownOpen.toString()"
        [attr.aria-controls]="listboxId"
        [attr.aria-describedby]="resolvedDescribedBy"
        [attr.aria-invalid]="effectiveInvalid ? 'true' : null"
        [attr.data-invalid]="effectiveInvalid ? 'true' : null"
        [attr.tabindex]="isDisabled ? null : '0'"
        (click)="toggleDropdown()"
        (keydown)="handleTriggerKeydown($event)"
        (liClickOutside)="closeDropdown(restoreFocus: false, preserveFocusTarget: $event.target)">
        <template [ngTemplateOutlet]="triggerTemplate?.templateRef"
            [ngTemplateOutletValue]="triggerContext">
        </template>
    </div>

    <div *ngIf="triggerTemplate == null && usesAddonTriggerIcon" [class]="resolvedInputGroupClass">
        <button type="button" #dropdownButton [attr.data-label]="'li_multi_select_btn_toggle'" [attr.data-li-form-focus-target]="'true'" [class]="resolvedButtonClass"
            [attr.data-value]="selectedDataValue"
            role="combobox"
            [attr.aria-expanded]="dropdownOpen.toString()"
            [attr.aria-controls]="listboxId"
            [attr.aria-describedby]="resolvedDescribedBy"
            [attr.aria-invalid]="effectiveInvalid ? 'true' : null"
            aria-haspopup="listbox"
            (click)="toggleDropdown()" (liClickOutside)="closeDropdown(restoreFocus: false, preserveFocusTarget: $event.target)" tabindex="0"
            [attr.data-invalid]="effectiveInvalid ? 'true' : null"
            [disabled]="isDisabled">

            <span class="dropdown-value" *ngIf="selectedValues.isEmpty == true">{{ placeholder}}</span>

            <span class="dropdown-values" *ngIf="selectedValues.isNotEmpty == true">
                <span class="badge dropdown-tag me-2" *ngFor="let selVal of selectedLabels">
                    {{ selVal }} 
                </span>
            </span>

            <span *ngIf="showClearButton && hasSelection && !isDisabled"
                class="dropdown-clear"
                role="button"
                [attr.aria-label]="resolvedClearButtonLabel"
                (click)="clearSelection($event)">
                <i class="ph ph-x"></i>
            </span>
        </button>
        <span class="input-group-text dropdown-trigger-addon" aria-hidden="true">
            <i [class]="resolvedTriggerIconClass"></i>
        </span>
    </div>

    <button *ngIf="triggerTemplate == null && !usesAddonTriggerIcon" type="button" #dropdownButton [attr.data-label]="'li_multi_select_btn_toggle'" [attr.data-li-form-focus-target]="'true'" [class]="resolvedButtonClass"
        [attr.data-value]="selectedDataValue"
        role="combobox"
        [attr.aria-expanded]="dropdownOpen.toString()"
        [attr.aria-controls]="listboxId"
        [attr.aria-describedby]="resolvedDescribedBy"
        [attr.aria-invalid]="effectiveInvalid ? 'true' : null"
        aria-haspopup="listbox"
        (click)="toggleDropdown()" (liClickOutside)="closeDropdown(restoreFocus: false, preserveFocusTarget: $event.target)" tabindex="0"
        [attr.data-invalid]="effectiveInvalid ? 'true' : null"
        [disabled]="isDisabled">

        <span class="dropdown-value" *ngIf="selectedValues.isEmpty == true">{{ placeholder}}</span>

        <span class="dropdown-values" *ngIf="selectedValues.isNotEmpty == true">
            <span class="badge dropdown-tag me-2" *ngFor="let selVal of selectedLabels">
                {{ selVal }} 
            </span>
        </span>

        <span *ngIf="showClearButton && hasSelection && !isDisabled"
            class="dropdown-clear"
            role="button"
            [attr.aria-label]="resolvedClearButtonLabel"
            (click)="clearSelection($event)">
            <i class="ph ph-x"></i>
        </span>

        <span *ngIf="usesOverlayTriggerIcon" class="dropdown-trigger-icon" aria-hidden="true">
            <i [class]="resolvedTriggerIconClass"></i>
        </span>

    </button>
    <div #dropdownContainer class="dropdown-container dropdown-menu"
        [class.dropdown-open]="dropdownOpen">
        <div *ngIf="searchable" class="dropdown-search" (click)="$event.stopPropagation()">
            <div class="form-control-feedback form-control-feedback-start m-2">
                <input #inputSearch type="text" [class]="resolvedSearchInputClass" [placeholder]="searchPlaceholder"
                    (input)="searchHandle($event.target.value)"
                    [attr.data-label]="'li_multi_select_input_search'"
                    tabindex="-1" [attr.aria-label]="searchAriaLabel">
                <div class="form-control-feedback-icon">
                    <i class="ph-magnifying-glass"></i>
                </div>
            </div>
        </div>
        <ul [attr.id]="listboxId" role="listbox" aria-multiselectable="true" [attr.data-label]="'li_multi_select_options'">
            <!-- multiple -->
            <li class="dropdown-item" *ngFor="let o of options; let idx = index"
                [class.active]="o.selected"
                [attr.id]="optionId(idx)"
                [attr.aria-selected]="o.selected.toString()"
                tabindex="-1" (click)="onLiClickHandle($event,o)"
                role="option" [hidden]="o.visible == false"
                [attr.data-value]="optionDataValue(o)"
                [attr.data-label]="'li_multi_select_item_' + idx.toString()">
                <input (click)="onCheckboxClickHandle($event,o)" [checked]="o.selected" class="form-check-input m-0 me-3" type="checkbox" tabindex="-1"
                    [attr.data-label]="'li_multi_select_checkbox_' + idx.toString()">
                <span class="dropdown-item-label">{{o.text}}</span>
            </li>
        </ul>
    </div>
    <div *ngIf="showErrorFeedback" [class]="resolvedFeedbackClass">{{ effectiveErrorText }}</div>
    <div *ngIf="hasHelperText" class="form-text mt-1">{{ helperText }}</div>
</div>
