name: limitless_ui
description: Reusable AngularDart UI components and directives for web applications.
version: 3.0.0-dev.1
homepage: https://github.com/insinfo/limitless_ui
repository: https://github.com/insinfo/limitless_ui
issue_tracker: https://github.com/insinfo/limitless_ui/issues
# Todas as dependências já são hospedadas no pub.dev, mas a publicação do
# limitless_ui é uma entrega separada: remover esta trava somente quando a
# publicação for solicitada e preparada explicitamente.
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  essential_core: ^1.4.0
  popper: ^2.0.0-dev.1
  ngx_dart: ^9.0.0-dev.2
  ngx_forms: ^9.0.0-dev.2
  ngx_router: ^9.0.0-dev.2
  web: ^1.1.1
  intl: ^0.19.0
  # é obrigatorio para o consumidor funcionar corretamente
  sass_builder: ^2.2.1
dev_dependencies:
  lints: ^5.0.0
  test: ^1.26.3
  ngx_test: ^9.0.0-dev.2
  build_runner: ">=2.4.12 <2.9.0"
  build_test: ^2.2.2
  build_web_compilers: ^4.0.11
  # para ui testes
  puppeteer: ^3.16.0
