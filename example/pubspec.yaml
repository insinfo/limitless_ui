name: limitless_ui_example
description: Showcase application for limitless_ui components.
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  essential_core: ^1.4.0
  i18n: ^4.2.1
  limitless_ui:
    path: ..
  web: ^1.1.1
  ngx_dart:
    git:
      url: https://github.com/insinfo/angular.git
      ref: master
      path: ngx_dart
  ngx_forms:
    git:
      url: https://github.com/insinfo/angular.git
      ref: master
      path: ngx_forms
  ngx_router:
    git:
      url: https://github.com/insinfo/angular.git
      ref: master
      path: ngx_router

dev_dependencies:
  build_runner: ^2.4.12
  build_web_compilers: ^4.0.11
  lints: ^5.0.0
  sass_builder: ^2.2.1
  webdev: ">=3.7.1 <3.7.2"

dependency_overrides:
  ngx_compiler:
    git:
      url: https://github.com/insinfo/angular.git
      ref: master
      path: ngx_compiler
  ngx_dart:
    git:
      url: https://github.com/insinfo/angular.git
      ref: master
      path: ngx_dart
