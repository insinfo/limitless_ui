publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  essential_core: ^1.4.0
  i18n: ^4.2.1
  limitless_ui:
    path: ..
  web: ^1.1.1
  ngx_dart: ^9.0.0-dev.2
  ngx_forms: ^9.0.0-dev.2
  ngx_router: ^9.0.0-dev.2

dev_dependencies:
  build_runner: ^2.4.12
  build_web_compilers: ^4.0.11
  lints: ^5.0.0
  sass_builder: ^2.2.1
  webdev: ">=3.7.1 <3.7.2"
